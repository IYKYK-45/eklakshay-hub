version: '3.8'

networks:
  eklakshay-network:
    name: eklakshay-network
    driver: bridge

volumes:
  postgres-data:
    name: eklakshay-postgres-data

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.10
  env_file:
    - ../../.env
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-eklakshay_admin}:${POSTGRES_PASSWORD:-eklakshay_secret}@metadata-db:5432/${POSTGRES_DB:-eklakshay_metadata}
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    - AIRFLOW__CORE__TEST_CONNECTION=Enabled
    - AIRFLOW__WEBSERVER__SECRET_KEY=eklakshay_secret_key_airflow_2026_jwt
    - _PIP_ADDITIONAL_REQUIREMENTS=snowflake-connector-python apache-airflow-providers-snowflake docker
  volumes:
    - ../..:/opt/airflow/platform
    - ../../dags:/opt/airflow/dags
    - ../../spark:/opt/airflow/spark
    - ../../airflow/logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - eklakshay-network
  depends_on:
    metadata-db:
      condition: service_healthy

services:
  metadata-db:
    image: postgres:15-alpine
    container_name: eklakshay-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eklakshay_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eklakshay_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eklakshay_metadata}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - eklakshay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eklakshay_admin} -d ${POSTGRES_DB:-eklakshay_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  ingestion-service:
    build:
      context: ../../
      dockerfile: ingestion/Dockerfile
    container_name: eklakshay-ingestor
    restart: unless-stopped
    env_file:
      - ../../.env
    networks:
      - eklakshay-network
    depends_on:
      metadata-db:
        condition: service_healthy

  spark-processor:
    build:
      context: ../../
      dockerfile: spark/Dockerfile
    container_name: eklakshay-spark
    command: sleep infinity
    restart: always
    env_file:
      - ../../.env
    networks:
      - eklakshay-network
    depends_on:
      metadata-db:
        condition: service_healthy
    volumes:
      - ../../spark:/app/spark
      - ../../tests:/app/tests

  # Initializes Airflow DB migrations & default admin user automatically
  airflow-init:
    <<: *airflow-common
    container_name: eklakshay-airflow-init
    command: bash -c "airflow db migrate && airflow users create -u admin -f Admin -l Eklakshay -r Admin -e admin@eklakshay.io -p admin"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: eklakshay-airflow-webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: eklakshay-airflow-scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully