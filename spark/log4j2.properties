# Set default logging level to ERROR only
rootLogger.level = ERROR
rootLogger.appenderRefs = RFA
rootLogger.appenderRef.RFA.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Silence verbose Hadoop S3A and AWS SDK loggers
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = ERROR

logger.s3a.name = org.apache.hadoop.fs.s3a
logger.s3a.level = ERROR

logger.amazon.name = com.amazonaws
logger.amazon.level = ERROR

logger.spark.name = org.apache.spark
logger.spark.level = WARN